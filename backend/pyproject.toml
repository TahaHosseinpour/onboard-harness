[project]
name = "onboard-harness-backend"
version = "0.1.0"
description = "Agent harness (deepagents) and local API for Onboard Harness"
requires-python = ">=3.11"
dependencies = [
    # Agent harness
    "deepagents>=0.7.23,<0.8",
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-anthropic>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "pyyaml>=6",
    "openpyxl>=3.1",
    # Local API
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*", "server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
